name: release

on:
  push:
    branches:
      - master
    paths:
      - VERSION
      - scripts/version.mjs
      - scripts/release-draft.mjs
      - src-tauri/Cargo.toml
      - .github/workflows/release.yml

permissions:
  contents: write

# Serialize reruns of the same commit without dropping releases of other versions.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.draft.outputs.build }}
      tag: ${{ steps.draft.outputs.tag }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout release commit and history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check VERSION and prepare release draft
        id: draft
        uses: actions/github-script@v7
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
        with:
          script: |
            const { prepareRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-draft.mjs`);
            const result = await prepareRelease({
              github, repo: context.repo, root: process.env.GITHUB_WORKSPACE,
              before: process.env.RELEASE_BEFORE, sha: context.sha,
            });
            for (const [key, value] of Object.entries(result)) core.setOutput(key, String(value));

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
          - label: linux-x64
            runner: ubuntu-24.04
          - label: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Synchronize app version from VERSION
        run: node scripts/version.mjs sync

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate
          pnpm --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            curl \
            wget \
            file \
            unzip

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle for release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Ollaic GaLaGame Maker ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          prerelease: false

      - name: Verify macOS app signature
        if: startsWith(matrix.label, 'macos-')
        shell: bash
        run: codesign --verify --deep --strict --verbose=4 target/release/bundle/macos/Ollaic.app
