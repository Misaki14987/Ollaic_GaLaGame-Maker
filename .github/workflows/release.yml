name: release

on:
  # Only run trusted, merged code; this also supports PRs from forks.
  pull_request_target:
    types: [closed]
    branches: [master]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      ref: ${{ steps.version.outputs.ref }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # GITHUB_TOKEN pushes do not trigger another workflow. Build the new
      # tag in this run instead of relying on the push.tags trigger.
      - name: Prepare version
        id: version
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
          RELEASE_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: node scripts/release-version.mjs

  build:
    needs: prepare
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            runner: windows-latest
          - label: linux-x64
            runner: ubuntu-24.04
          - label: macos-arm64
            runner: macos-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            curl \
            wget \
            file \
            unzip

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: pnpm tauri
          args: --locked

      - name: Verify macOS app signature
        if: startsWith(matrix.label, 'macos-')
        shell: bash
        run: codesign --verify --deep --strict --verbose=4 target/release/bundle/macos/Ollaic.app

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          if-no-files-found: error
          compression-level: 0
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.app.tar.gz

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Serialize duplicate runs of the same tag without dropping other PRs.
    concurrency:
      group: publish-${{ needs.prepare.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find installers -type f -print0)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo 'No release installers found' >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "Ollaic $RELEASE_TAG" --generate-notes --draft
          fi
          gh release edit "$RELEASE_TAG" --draft=false
